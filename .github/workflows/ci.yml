name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsc + browser bundle)
        run: npm run build

      - name: Verify the generated client bundle parses
        run: node --check lib/client.js

      - name: Tests
        run: npm test

      - name: Fail if the build dirtied tracked files
        run: git diff --exit-code
